<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>Panel de Administración</title>

<style>

:root{

  --black:#070807;
  --black-2:#0d0f0d;
  --card:#151815;

  --olive:#718238;
  --olive-light:#9aae52;

  --yellow:#f5c518;
  --yellow-light:#ffd83d;

  --red:#e53935;

  --white:#f7f7f2;
  --muted:#b8bdb5;

  --line:rgba(255,255,255,.10);

  --shadow:
  0 18px 45px rgba(0,0,0,.35);

}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  background:var(--black);

  color:var(--white);

  font-family:
  Inter,
  system-ui,
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  sans-serif;

}

button,
input,
textarea,
select{

  font:inherit;

}

button{

  cursor:pointer;

}

.container{

  width:min(1100px,92%);

  margin:auto;

}


/* ==================================================
   ENCABEZADO
================================================== */

header{

  background:

  radial-gradient(
    circle at 20% 0%,
    rgba(113,130,56,.30),
    transparent 35%
  ),

  radial-gradient(
    circle at 90% 20%,
    rgba(245,197,24,.12),
    transparent 30%
  ),

  var(--black);

  border-bottom:
  1px solid var(--line);

  padding:20px 0;

}

.header-content{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:20px;

}

.logo-text{

  font-size:1.5rem;

  font-weight:900;

  letter-spacing:.08em;

}

.logo-text span{

  color:var(--yellow);

}

.admin-label{

  color:var(--muted);

  font-size:.9rem;

}


/* ==================================================
   CONTENIDO
================================================== */

main{

  padding:30px 0 70px;

}

.page-title{

  margin:0;

  font-size:
  clamp(
    1.7rem,
    4vw,
    2.3rem
  );

}

.page-subtitle{

  margin:8px 0 25px;

  color:var(--muted);

}


/* ==================================================
   SELECTOR DE NEGOCIO
================================================== */

.business-selector{

  background:var(--card);

  border:
  1px solid var(--line);

  border-radius:20px;

  padding:20px;

  margin-bottom:25px;

  box-shadow:var(--shadow);

}

.business-selector label{

  display:block;

  color:var(--muted);

  font-size:.85rem;

  font-weight:700;

  margin-bottom:8px;

}

.business-selector select{

  width:100%;

  max-width:600px;

  background:#090a09;

  color:var(--white);

  border:
  1px solid var(--line);

  border-radius:11px;

  padding:13px;

  outline:none;

}

.business-selector select:focus{

  border-color:
  var(--olive-light);

}


/* ==================================================
   ESTADÍSTICAS
================================================== */

.stats{

  display:grid;

  grid-template-columns:
  repeat(
    3,
    1fr
  );

  gap:15px;

  margin-bottom:25px;

}

.stat-card{

  background:var(--card);

  border:
  1px solid var(--line);

  border-radius:18px;

  padding:20px;

}

.stat-number{

  font-size:2rem;

  font-weight:900;

  color:var(--yellow);

}

.stat-label{

  color:var(--muted);

  font-size:.9rem;

}


/* ==================================================
   PANELES
================================================== */

.panel{

  background:var(--card);

  border:
  1px solid var(--line);

  border-radius:22px;

  padding:25px;

  box-shadow:var(--shadow);

  margin-bottom:25px;

}

.panel-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:22px;

}

.panel-title{

  margin:0;

  font-size:1.4rem;

}


/* ==================================================
   BOTONES
================================================== */

.btn{

  border:0;

  border-radius:11px;

  padding:11px 16px;

  font-weight:800;

  transition:.2s;

}

.btn:hover{

  transform:
  translateY(-1px);

}

.btn-primary{

  background:var(--yellow);

  color:#000;

}

.btn-primary:hover{

  background:var(--yellow-light);

}

.btn-danger{

  background:var(--red);

  color:#fff;

}

.btn-secondary{

  background:var(--olive);

  color:#fff;

}

.btn-dark{

  background:#090a09;

  color:var(--white);

  border:
  1px solid var(--line);

}


/* ==================================================
   FORMULARIO
================================================== */

.form-grid{

  display:grid;

  grid-template-columns:
  1fr 1fr;

  gap:15px;

}

.field{

  display:flex;

  flex-direction:column;

  gap:7px;

}

.field.full{

  grid-column:
  1/-1;

}

label{

  color:var(--muted);

  font-size:.85rem;

  font-weight:700;

}

input,
textarea,
select{

  width:100%;

  background:#090a09;

  color:var(--white);

  border:
  1px solid var(--line);

  border-radius:10px;

  padding:12px;

  outline:none;

}

input:focus,
textarea:focus,
select:focus{

  border-color:
  var(--olive-light);

  box-shadow:
  0 0 0 3px
  rgba(154,174,82,.12);

}

textarea{

  min-height:90px;

  resize:vertical;

}

.form-actions{

  display:flex;

  gap:10px;

  margin-top:20px;

  flex-wrap:wrap;

}


/* ==================================================
   CONTENEDOR DE CATEGORÍAS
================================================== */

.category-group{

  margin-bottom:35px;

}

.category-group:last-child{

  margin-bottom:0;

}

.category-title{

  display:flex;

  align-items:center;

  gap:10px;

  margin:0 0 15px;

  padding:14px 16px;

  background:

  linear-gradient(
    90deg,
    rgba(113,130,56,.28),
    rgba(113,130,56,.06),
    transparent
  );

  border-left:
  6px solid var(--olive-light);

  border-bottom:
  1px solid rgba(154,174,82,.25);

  border-radius:
  0 14px 14px 0;

  color:var(--white);

  font-size:1.25rem;

  font-weight:900;

}

.category-count{

  margin-left:auto;

  color:var(--muted);

  font-size:.8rem;

  font-weight:700;

}


/* ==================================================
   LISTA DE PRODUCTOS
================================================== */

.products-list{

  display:flex;

  flex-direction:column;

  gap:25px;

}

.category-products{

  display:grid;

  gap:12px;

}

.product-row{

  display:grid;

  grid-template-columns:
  70px
  1fr
  auto;

  align-items:center;

  gap:15px;

  padding:14px;

  background:#0b0d0b;

  border:
  1px solid var(--line);

  border-radius:15px;

}

.product-photo{

  width:70px;

  height:70px;

  border-radius:12px;

  overflow:hidden;

  background:

  linear-gradient(
    135deg,
    #20251c,
    #0c0e0c
  );

  display:grid;

  place-items:center;

  font-size:1.8rem;

}

.product-photo img{

  width:100%;

  height:100%;

  object-fit:cover;

}

.product-info h3{

  margin:0 0 5px;

  color:var(--yellow);

  font-size:1.05rem;

}

.product-info p{

  margin:0 0 5px;

  color:var(--muted);

  font-size:.85rem;

}

.product-price{

  color:var(--olive-light);

  font-weight:900;

}

.product-actions{

  display:flex;

  gap:7px;

  flex-wrap:wrap;

  justify-content:flex-end;

}


/* ==================================================
   ESTADO
================================================== */

.status{

  display:inline-block;

  padding:4px 9px;

  border-radius:999px;

  font-size:.72rem;

  font-weight:800;

}

.status.active{

  background:
  rgba(154,174,82,.18);

  color:var(--olive-light);

}

.status.inactive{

  background:
  rgba(229,57,53,.15);

  color:var(--red);

}


/* ==================================================
   CARGANDO / VACÍO / ERROR
================================================== */

.loading,
.empty,
.error{

  text-align:center;

  padding:35px 15px;

  color:var(--muted);

}

.error{

  color:var(--red);

}

.error-details{

  margin-top:12px;

  font-size:.8rem;

  word-break:break-word;

}


/* ==================================================
   TOAST
================================================== */

.toast{

  position:fixed;

  left:50%;

  bottom:25px;

  transform:
  translate(-50%,120px);

  background:var(--yellow);

  color:#000;

  padding:13px 20px;

  border-radius:999px;

  font-weight:900;

  box-shadow:var(--shadow);

  transition:.3s;

  z-index:50;

  text-align:center;

  max-width:
  calc(100% - 30px);

}

.toast.show{

  transform:
  translate(-50%,0);

}


/* ==================================================
   RESPONSIVE
================================================== */

@media(max-width:700px){

  .container{

    width:
    calc(100% - 24px);

  }

  header{

    padding:16px 0;

  }

  .header-content{

    align-items:flex-start;

    flex-direction:column;

    gap:5px;

  }

  main{

    padding-top:22px;

  }

  .stats{

    grid-template-columns:
    1fr;

  }

  .form-grid{

    grid-template-columns:
    1fr;

  }

  .field.full{

    grid-column:auto;

  }

  .panel{

    padding:18px;

    border-radius:18px;

  }

  .panel-header{

    align-items:flex-start;

    flex-direction:column;

  }

  .panel-header .btn{

    width:100%;

  }

  .product-row{

    grid-template-columns:
    60px
    1fr;

  }

  .product-photo{

    width:60px;

    height:60px;

  }

  .product-actions{

    grid-column:
    1/-1;

    justify-content:flex-start;

  }

  .product-actions .btn{

    flex:1;

    min-width:90px;

  }

  .form-actions .btn{

    width:100%;

  }

}

</style>

</head>


<body>


<header>

<div class="container header-content">

<div class="logo-text">

VERDE <span>OLIVA</span>

</div>

<div class="admin-label">

Panel central de administración

</div>

</div>

</header>


<main class="container">


<h1 class="page-title">

Administración

</h1>


<p class="page-subtitle">

Gestioná los productos de cada negocio desde un único panel.

</p>


<!-- ==================================================
     SELECTOR DE NEGOCIO
================================================== -->

<section class="business-selector">


<label for="businessSelect">

Seleccioná el negocio que querés administrar

</label>


<select
id="businessSelect"
onchange="changeBusiness()"
>

<option value="">

Cargando negocios...

</option>

</select>


</section>


<!-- ==================================================
     ESTADÍSTICAS
================================================== -->

<div class="stats">


<div class="stat-card">

<div
class="stat-number"
id="totalProducts"
>

0

</div>

<div class="stat-label">

Productos

</div>

</div>


<div class="stat-card">

<div
class="stat-number"
id="activeProducts"
>

0

</div>

<div class="stat-label">

Productos activos

</div>

</div>


<div class="stat-card">

<div
class="stat-number"
id="totalCategories"
>

0

</div>

<div class="stat-label">

Categorías

</div>

</div>


</div>


<!-- ==================================================
     AGREGAR / EDITAR PRODUCTO
================================================== -->

<section class="panel">


<div class="panel-header">

<h2
class="panel-title"
id="formTitle"
>

Agregar producto

</h2>

</div>


<form id="productForm">


<div class="form-grid">


<div class="field">

<label for="productName">

Nombre del producto

</label>

<input
id="productName"
type="text"
placeholder="Ej.: Bowl Pollo Grillado"
required
>

</div>


<div class="field">

<label for="productPrice">

Precio

</label>

<input
id="productPrice"
type="number"
placeholder="450"
min="0"
step="1"
required
>

</div>


<div class="field">

<label for="productCategory">

Categoría

</label>

<select
id="productCategory"
required
>

<option value="Ensaladas">
Ensaladas
</option>

<option value="Ensaladas calientes">
Ensaladas calientes
</option>

<option value="Sopas crema">
Sopas crema
</option>

</select>

</div>


<div class="field">

<label for="productImage">

URL de imagen

</label>

<input
id="productImage"
type="url"
placeholder="https://..."
>

</div>


<div class="field full">

<label for="productDescription">

Descripción

</label>

<textarea
id="productDescription"
placeholder="Escribí una descripción del producto..."
></textarea>

</div>


</div>


<div class="form-actions">


<button
type="submit"
class="btn btn-primary"
id="saveProductButton"
>

Agregar producto

</button>


<button
type="button"
class="btn btn-dark"
onclick="clearForm()"
>

Limpiar

</button>


</div>


</form>


</section>


<!-- ==================================================
     PRODUCTOS
================================================== -->

<section class="panel">


<div class="panel-header">


<h2 class="panel-title">

Productos del negocio

</h2>


<button
class="btn btn-secondary"
onclick="loadProducts()"
>

Actualizar

</button>


</div>


<div
id="productsList"
class="products-list"
>

<div class="loading">

Seleccioná un negocio para ver sus productos.

</div>

</div>


</section>


</main>


<div
id="toast"
class="toast"
>

Listo

</div>


<script>


/* ==================================================
   SUPABASE
================================================== */


const SUPABASE_URL =

'https://cwiawvsxmkbohfbuouqv.supabase.co/rest/v1';


const SUPABASE_KEY =

'sb_publishable_0JAQhasES693WKQkVh5ACw_NHnSPceG';


/* ==================================================
   ESTADO
================================================== */


let businesses = [];

let products = [];

let selectedBusinessId = null;

let editingProductId = null;


/* ==================================================
   ELEMENTOS
================================================== */


const businessSelect =

document.getElementById(
'businessSelect'
);


const productForm =

document.getElementById(
'productForm'
);


const productName =

document.getElementById(
'productName'
);


const productPrice =

document.getElementById(
'productPrice'
);


const productCategory =

document.getElementById(
'productCategory'
);


const productImage =

document.getElementById(
'productImage'
);


const productDescription =

document.getElementById(
'productDescription'
);


/* ==================================================
   HEADERS SUPABASE
================================================== */


function supabaseHeaders(){

  return {

    'apikey':
    SUPABASE_KEY,

    'Authorization':
    `Bearer ${SUPABASE_KEY}`,

    'Content-Type':
    'application/json',

    'Prefer':
    'return=representation'

  };

}


/* ==================================================
   CARGAR NEGOCIOS
================================================== */


async function loadBusinesses(){

  try{

    const response =

    await fetch(

      `${SUPABASE_URL}/Businesses?select=*`,

      {

        method:'GET',

        headers:
        supabaseHeaders()

      }

    );


    if(!response.ok){

      const errorText =
      await response.text();

      throw new Error(

        `Error ${response.status}: ${errorText}`

      );

    }


    businesses =

    await response.json();


    businessSelect.innerHTML =

    '';


    if(!businesses.length){

      businessSelect.innerHTML =

      '<option value="">No hay negocios registrados</option>';

      return;

    }


    businesses.forEach(

      business => {

        const option =

        document.createElement(
          'option'
        );


        option.value =

        business.id;


        option.textContent =

        business.name ||

        `Negocio ${business.id}`;


        businessSelect.appendChild(
          option
        );

      }

    );


    selectedBusinessId =

    businesses[0].id;


    businessSelect.value =

    selectedBusinessId;


    await loadProducts();


  }catch(error){

    console.error(error);


    businessSelect.innerHTML =

    '<option value="">Error cargando negocios</option>';


    showToast(

      'Error cargando los negocios'

    );

  }

}


/* ==================================================
   CAMBIAR NEGOCIO
================================================== */


function changeBusiness(){

  const value =

  businessSelect.value;


  if(!value){

    selectedBusinessId =
    null;

    products = [];

    renderProducts();

    return;

  }


  selectedBusinessId =

  Number(value);


  editingProductId =

  null;


  clearForm();


  loadProducts();

}


/* ==================================================
   CARGAR PRODUCTOS
================================================== */


async function loadProducts(){

  if(!selectedBusinessId){

    document.getElementById(
      'productsList'
    ).innerHTML =

    '<div class="empty">Seleccioná un negocio.</div>';

    return;

  }


  const list =

  document.getElementById(
    'productsList'
  );


  list.innerHTML =

  '<div class="loading">Cargando productos...</div>';


  try{

    const response =

    await fetch(

      `${SUPABASE_URL}/Products?business_id=eq.${selectedBusinessId}&select=*`,

      {

        method:'GET',

        headers:
        supabaseHeaders()

      }

    );


    if(!response.ok){

      const errorText =
      await response.text();


      throw new Error(

        `Error ${response.status}: ${errorText}`

      );

    }


    products =

    await response.json();


    renderProducts();


  }catch(error){

    console.error(error);


    list.innerHTML =

    `<div class="error">

      No se pudieron cargar los productos.

      <div class="error-details">

      ${escapeHTML(
        error.message
      )}

      </div>

    </div>`;

  }

}


/* ==================================================
   OBTENER ICONO DE CATEGORÍA
================================================== */


function getCategoryIcon(category){

  const normalized =

  String(category || '')
  .trim()
  .toLowerCase();


  if(
    normalized.includes(
      'ensalada caliente'
    )
  ){

    return '🍲';

  }


  if(
    normalized.includes(
      'ensalada'
    )
  ){

    return '🥗';

  }


  if(
    normalized.includes(
      'sopa'
    )
  ){

    return '🍵';

  }


  if(
    normalized.includes(
      'bocata'
    ) ||
    normalized.includes(
      'sandwich'
    )
  ){

    return '🥪';

  }


  if(
    normalized.includes(
      'bebida'
    )
  ){

    return '🥤';

  }


  if(
    normalized.includes(
      'postre'
    )
  ){

    return '🍰';

  }


  return '🍽️';

}


/* ==================================================
   NORMALIZAR CATEGORÍA
================================================== */


function normalizeCategory(category){

  if(
    !category ||
    !String(category).trim()
  ){

    return 'Otros';

  }


  return String(category).trim();

}


/* ==================================================
   ORDEN DE CATEGORÍAS
================================================== */


function getCategoryOrder(category){

  const normalized =

  normalizeCategory(
    category
  ).toLowerCase();


  if(
    normalized === 'ensaladas'
  ){

    return 1;

  }


  if(
    normalized === 'ensaladas calientes'
  ){

    return 2;

  }


  if(
    normalized === 'sopas crema'
  ){

    return 3;

  }


  return 100;

}


/* ==================================================
   MOSTRAR PRODUCTOS AGRUPADOS
================================================== */


function renderProducts(){

  const list =

  document.getElementById(
    'productsList'
  );


  updateStats();


  if(!products.length){

    list.innerHTML =

    '<div class="empty">Este negocio todavía no tiene productos.</div>';

    return;

  }


  /*
    Creamos un objeto donde cada categoría
    contiene sus productos.
  */


  const groupedProducts = {};


  products.forEach(

    product => {

      const category =

      normalizeCategory(
        product.category
      );


      if(
        !groupedProducts[category]
      ){

        groupedProducts[category] = [];

      }


      groupedProducts[category].push(
        product
      );

    }

  );


  /*
    Ordenamos las categorías.
    Ensaladas primero,
    Ensaladas calientes segundo,
    Sopas crema tercero.
    Las demás quedan después.
  */


  const sortedCategories =

  Object.keys(
    groupedProducts
  ).sort(

    (a,b) => {

      const orderA =

      getCategoryOrder(a);


      const orderB =

      getCategoryOrder(b);


      if(
        orderA !== orderB
      ){

        return orderA - orderB;

      }


      return a.localeCompare(
        b,
        'es'
      );

    }

  );


  /*
    Construimos cada categoría
    por separado.
  */


  list.innerHTML =

  sortedCategories.map(

    category => {

      const categoryProducts =

      groupedProducts[category];


      return `

      <div class="category-group">


        <div class="category-title">


          <span>

          ${getCategoryIcon(category)}

          </span>


          <span>

          ${escapeHTML(category)}

          </span>


          <span class="category-count">

          ${categoryProducts.length}

          ${
            categoryProducts.length === 1
            ?
            'producto'
            :
            'productos'
          }

          </span>


        </div>


        <div class="category-products">


          ${


          categoryProducts.map(

            product => `


            <div class="product-row">


              <div class="product-photo">


                ${

                product.image_url

                ?

                `<img
                src="${escapeAttribute(
                  product.image_url
                )}"
                alt="${escapeAttribute(
                  product.name ||
                  'Producto'
                )}"
                >`

                :

                getCategoryIcon(
                  category
                )

                }


              </div>


              <div class="product-info">


                <h3>

                ${escapeHTML(
                  product.name ||
                  'Sin nombre'
                )}

                </h3>


                <p>

                ${escapeHTML(
                  product.descripcion ||
                  'Sin descripción'
                )}

                </p>


                <span class="product-price">

                $${Number(
                  product.price || 0
                ).toLocaleString(
                  'es-ES'
                )}

                </span>


                <br>


                <span

                class="status ${

                product.active

                ?

                'active'

                :

                'inactive'

                }"

                >

                ${

                product.active

                ?

                'Activo'

                :

                'Inactivo'

                }

                </span>


                <span>

                · ${escapeHTML(
                  category
                )}

                </span>


              </div>


              <div class="product-actions">


                <button

                class="btn btn-secondary"

                onclick="toggleProduct(
                  ${product.id},
                  ${product.active}
                )"

                >

                ${

                product.active

                ?

                'Desactivar'

                :

                'Activar'

                }

                </button>


                <button

                class="btn btn-dark"

                onclick="editProduct(
                  ${product.id}
                )"

                >

                Editar

                </button>


                <button

                class="btn btn-danger"

                onclick="deleteProduct(
                  ${product.id}
                )"

                >

                Eliminar

                </button>


              </div>


            </div>


            `

          ).join('')


          }


        </div>


      </div>

      `;

    }

  ).join('');

}


/* ==================================================
   AGREGAR / EDITAR PRODUCTO
================================================== */


productForm.addEventListener(

'submit',

async function(event){

  event.preventDefault();


  if(!selectedBusinessId){

    showToast(
      'Seleccioná un negocio primero'
    );

    return;

  }


  const name =

  productName.value.trim();


  const price =

  Number(
    productPrice.value
  );


  const category =

  productCategory.value;


  const image_url =

  productImage.value.trim();


  const descripcion =

  productDescription.value.trim();


  if(!name){

    showToast(
      'Ingresá el nombre del producto'
    );

    return;

  }


  if(price < 0){

    showToast(
      'El precio no puede ser negativo'
    );

    return;

  }


  const payload = {

    name:name,

    price:price,

    category:category,

    image_url:
    image_url || null,

    descripcion:
    descripcion || null,

    active:true

  };


  try{

    let response;


    if(editingProductId){

      response =

      await fetch(

        `${SUPABASE_URL}/Products?id=eq.${editingProductId}&business_id=eq.${selectedBusinessId}`,

        {

          method:'PATCH',

          headers:
          supabaseHeaders(),

          body:
          JSON.stringify(
            payload
          )

        }

      );

    }else{

      payload.business_id =

      selectedBusinessId;


      response =

      await fetch(

        `${SUPABASE_URL}/Products`,

        {

          method:'POST',

          headers:
          supabaseHeaders(),

          body:
          JSON.stringify(
            payload
          )

        }

      );

    }


    if(!response.ok){

      const errorText =
      await response.text();


      throw new Error(

        `Error ${response.status}: ${errorText}`

      );

    }


    showToast(

      editingProductId

      ?

      '✓ Producto actualizado'

      :

      '✓ Producto agregado'

    );


    clearForm();


    await loadProducts();


  }catch(error){

    console.error(error);


    showToast(

      'Error: ' +
      error.message

    );

  }

}

);


/* ==================================================
   EDITAR PRODUCTO
================================================== */


function editProduct(id){

  const product =

  products.find(

    item =>

    Number(item.id) ===
    Number(id)

  );


  if(!product){

    return;

  }


  editingProductId =

  product.id;


  productName.value =

  product.name || '';


  productPrice.value =

  product.price || '';


  productCategory.value =

  product.category ||

  'Ensaladas';


  productImage.value =

  product.image_url ||

  '';


  productDescription.value =

  product.descripcion ||

  '';


  document.getElementById(
    'formTitle'
  ).textContent =

  'Editar producto';


  document.getElementById(
    'saveProductButton'
  ).textContent =

  'Guardar cambios';


  window.scrollTo({

    top:0,

    behavior:'smooth'

  });

}


/* ==================================================
   LIMPIAR FORMULARIO
================================================== */


function clearForm(){

  editingProductId =
  null;


  productForm.reset();


  productCategory.value =
  'Ensaladas';


  document.getElementById(
    'formTitle'
  ).textContent =

  'Agregar producto';


  document.getElementById(
    'saveProductButton'
  ).textContent =

  'Agregar producto';

}


/* ==================================================
   ACTIVAR / DESACTIVAR
================================================== */


async function toggleProduct(

  id,

  currentStatus

){

  try{

    const response =

    await fetch(

      `${SUPABASE_URL}/Products?id=eq.${id}&business_id=eq.${selectedBusinessId}`,

      {

        method:'PATCH',

        headers:
        supabaseHeaders(),

        body:

        JSON.stringify({

          active:
          !currentStatus

        })

      }

    );


    if(!response.ok){

      const errorText =
      await response.text();


      throw new Error(

        `Error ${response.status}: ${errorText}`

      );

    }


    showToast(

      currentStatus

      ?

      'Producto desactivado'

      :

      'Producto activado'

    );


    await loadProducts();


  }catch(error){

    console.error(error);


    showToast(

      'Error: ' +
      error.message

    );

  }

}


/* ==================================================
   ELIMINAR PRODUCTO
================================================== */


async function deleteProduct(id){

  const product =

  products.find(

    item =>

    Number(item.id) ===
    Number(id)

  );


  if(!product){

    return;

  }


  const confirmed =

  confirm(

    `¿Querés eliminar "${product.name}"?`

  );


  if(!confirmed){

    return;

  }


  try{

    const response =

    await fetch(

      `${SUPABASE_URL}/Products?id=eq.${id}&business_id=eq.${selectedBusinessId}`,

      {

        method:'DELETE',

        headers:
        supabaseHeaders()

      }

    );


    if(!response.ok){

      const errorText =
      await response.text();


      throw new Error(

        `Error ${response.status}: ${errorText}`

      );

    }


    showToast(

      'Producto eliminado'

    );


    await loadProducts();


  }catch(error){

    console.error(error);


    showToast(

      'Error: ' +
      error.message

    );

  }

}


/* ==================================================
   ESTADÍSTICAS
================================================== */


function updateStats(){

  const total =

  products.length;


  const active =

  products.filter(

    product =>

    product.active === true

  ).length;


  const categories =

  new Set(

    products.map(

      product =>

      normalizeCategory(
        product.category
      )

    )

  );


  document.getElementById(
    'totalProducts'
  ).textContent =

  total;


  document.getElementById(
    'activeProducts'
  ).textContent =

  active;


  document.getElementById(
    'totalCategories'
  ).textContent =

  categories.size;

}


/* ==================================================
   SEGURIDAD HTML
================================================== */


function escapeHTML(text){

  return String(text)

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}


function escapeAttribute(text){

  return escapeHTML(text);

}


/* ==================================================
   MENSAJES
================================================== */


function showToast(text){

  const toast =

  document.getElementById(
    'toast'
  );


  toast.textContent =

  text;


  toast.classList.add(
    'show'
  );


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =

  setTimeout(

    function(){

      toast.classList.remove(
        'show'
      );

    },

    2500

  );

}
