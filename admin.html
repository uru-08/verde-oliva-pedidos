<!DOCTYPE html>

<html lang="es">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0"

>

<title>Panel de Administración</title>

<style>

:root{
  --black:#070807;
  --black-2:#0d0f0d;
  --card:#151815;
  --olive:#718238;
  --olive-light:#9aae52;
  --yellow:#f5c518;
  --yellow-light:#ffd83d;
  --red:#e53935;
  --white:#f7f7f2;
  --muted:#b8bdb5;
  --line:rgba(255,255,255,.10);
  --shadow:0 18px 45px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--black);
  color:var(--white);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:min(1100px,92%);
  margin:auto;
}

/* =========================
   ENCABEZADO
========================= */

header{
  background:
  radial-gradient(circle at 20% 0%,rgba(113,130,56,.30),transparent 35%),
  radial-gradient(circle at 90% 20%,rgba(245,197,24,.12),transparent 30%),
  var(--black);
  border-bottom:1px solid var(--line);
  padding:20px 0;
}

.header-content{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.logo-text{
  font-size:1.5rem;
  font-weight:900;
  letter-spacing:.08em;
}

.logo-text span{
  color:var(--yellow);
}

.admin-label{
  color:var(--muted);
  font-size:.9rem;
}

/* =========================
   CONTENIDO
========================= */

main{
  padding:30px 0 70px;
}

.page-title{
  margin:0;
  font-size:clamp(1.7rem,4vw,2.3rem);
}

.page-subtitle{
  margin:8px 0 25px;
  color:var(--muted);
}

/* =========================
   SELECTOR DE NEGOCIO
========================= */

.business-selector{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  margin-bottom:25px;
  box-shadow:var(--shadow);
}

.business-selector label{
  display:block;
  color:var(--muted);
  font-size:.85rem;
  font-weight:700;
  margin-bottom:8px;
}

.business-selector select{
  width:100%;
  max-width:600px;
  background:#090a09;
  color:var(--white);
  border:1px solid var(--line);
  border-radius:11px;
  padding:13px;
  outline:none;
}

/* =========================
   ESTADÍSTICAS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
}

.stat-number{
  font-size:2rem;
  font-weight:900;
  color:var(--yellow);
}

.stat-label{
  color:var(--muted);
  font-size:.9rem;
}

/* =========================
   PANELES
========================= */

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:25px;
  box-shadow:var(--shadow);
  margin-bottom:25px;
}

.panel-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

.panel-title{
  margin:0;
  font-size:1.4rem;
}

/* =========================
   BOTONES
========================= */

.btn{
  border:0;
  border-radius:11px;
  padding:11px 16px;
  font-weight:800;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

.btn-primary{
  background:var(--yellow);
  color:#000;
}

.btn-primary:hover{
  background:var(--yellow-light);
}

.btn-danger{
  background:var(--red);
  color:#fff;
}

.btn-secondary{
  background:var(--olive);
  color:#fff;
}

.btn-dark{
  background:#090a09;
  color:var(--white);
  border:1px solid var(--line);
}

/* =========================
   FORMULARIO
========================= */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

label{
  color:var(--muted);
  font-size:.85rem;
  font-weight:700;
}

input,
textarea,
select{
  width:100%;
  background:#090a09;
  color:var(--white);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--olive-light);
  box-shadow:0 0 0 3px rgba(154,174,82,.12);
}

textarea{
  min-height:90px;
  resize:vertical;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}

/* =========================
   FOTOS
========================= */

.image-upload-box{
  background:#090a09;
  border:1px dashed rgba(154,174,82,.45);
  border-radius:15px;
  padding:15px;
}

.image-upload-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

.file-input{
  display:none;
}

.file-label{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--olive);
  color:#fff;
  border-radius:11px;
  padding:11px 16px;
  font-weight:800;
  cursor:pointer;
}

.file-label:hover{
  background:var(--olive-light);
}

.image-status{
  color:var(--muted);
  font-size:.85rem;
}

.image-preview{
  display:none;
  margin-top:15px;
  position:relative;
  width:180px;
  height:180px;
  border-radius:15px;
  overflow:hidden;
  background:#151815;
  border:1px solid var(--line);
}

.image-preview.show{
  display:block;
}

.image-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.remove-image-btn{
  position:absolute;
  top:8px;
  right:8px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:#fff;
  font-weight:900;
}

/* =========================
   PRODUCTOS POR CATEGORIA
========================= */

.category-group{
  margin-bottom:35px;
}

.category-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 18px;
  padding:13px 16px;
  background:linear-gradient(
    90deg,
    rgba(113,130,56,.25),
    rgba(113,130,56,.05),
    transparent
  );
  border-left:5px solid var(--olive-light);
  border-radius:0 12px 12px 0;
  color:var(--white);
  font-size:1.3rem;
}

/* =========================
   TARJETAS DE PRODUCTOS
========================= */

.products-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.product-card{
  display:flex;
  flex-direction:column;
  min-width:0;
  background:#0b0d0b;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-2px);
  border-color:rgba(154,174,82,.35);
}

/* FOTO */

.product-photo{
  width:100%;
  height:210px;
  background:
  linear-gradient(135deg,#20251c,#0c0e0c);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}

.product-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.product-photo-placeholder{
  font-size:3.5rem;
}

/* INFORMACIÓN */

.product-info{
  padding:18px;
  display:flex;
  flex-direction:column;
  flex:1;
  min-width:0;
}

.product-info h3{
  margin:0 0 8px;
  color:var(--yellow);
  font-size:1.15rem;
  line-height:1.3;
  overflow-wrap:anywhere;
}

.product-info p{
  margin:0 0 14px;
  color:var(--muted);
  font-size:.9rem;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.product-price{
  color:var(--olive-light);
  font-size:1.2rem;
  font-weight:900;
  margin-bottom:10px;
}

.product-status{
  margin-bottom:16px;
}

.status{
  display:inline-block;
  padding:5px 10px;
  border-radius:999px;
  font-size:.72rem;
  font-weight:800;
}

.status.active{
  background:rgba(154,174,82,.18);
  color:var(--olive-light);
}

.status.inactive{
  background:rgba(229,57,53,.15);
  color:var(--red);
}

/* BOTONES */

.product-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:0 18px 18px;
}

.product-actions .btn{
  width:100%;
  padding:10px 8px;
  font-size:.82rem;
}

.product-actions .btn-danger{
  grid-column:1/-1;
}

/* =========================
   CARGANDO / VACÍO / ERROR
========================= */

.loading,
.empty,
.error{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

.error{
  color:var(--red);
}

.error-details{
  margin-top:12px;
  font-size:.8rem;
  word-break:break-word;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,120px);
  background:var(--yellow);
  color:#000;
  padding:13px 20px;
  border-radius:999px;
  font-weight:900;
  box-shadow:var(--shadow);
  transition:.3s;
  z-index:50;
  text-align:center;
  max-width:calc(100% - 30px);
}

.toast.show{
  transform:translate(-50%,0);
}

/* =========================
   TABLET
========================= */

@media(max-width:950px){

  .products-list{
    grid-template-columns:repeat(2,1fr);
  }

}

/* =========================
   CELULAR
========================= */

@media(max-width:700px){

  .container{
    width:calc(100% - 24px);
  }

  header{
    padding:16px 0;
  }

  .header-content{
    align-items:flex-start;
    flex-direction:column;
    gap:5px;
  }

  main{
    padding-top:22px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .panel{
    padding:18px;
    border-radius:18px;
  }

  .panel-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .panel-header .btn{
    width:100%;
  }

  .products-list{
    grid-template-columns:1fr;
    gap:15px;
  }

  .product-photo{
    height:220px;
  }

  .product-info{
    padding:16px;
  }

  .product-actions{
    padding:0 16px 16px;
  }

  .form-actions .btn{
    width:100%;
  }

  .image-upload-row{
    flex-direction:column;
    align-items:stretch;
  }

  .file-label{
    width:100%;
  }

}

/* =========================
   CELULARES PEQUEÑOS
========================= */

@media(max-width:400px){

  .product-photo{
    height:190px;
  }

  .product-actions{
    grid-template-columns:1fr;
  }

  .product-actions .btn-danger{
    grid-column:auto;
  }

}

</style>

</head>

<body>

<header>

<div class="container header-content">

<div class="logo-text">
VERDE <span>OLIVA</span>
</div>

<div class="admin-label">
Panel central de administración
</div>

</div>

</header>

<main class="container">

<h1 class="page-title">
Administración
</h1>

<p class="page-subtitle">
Gestioná los productos de cada negocio desde un único panel.
</p>

<!-- SELECTOR DE NEGOCIO -->

<section class="business-selector">

<label for="businessSelect">
Seleccioná el negocio que querés administrar
</label>

<select
id="businessSelect"
onchange="changeBusiness()"

>

<option value="">
Cargando negocios...
</option>

</select>

</section>

<!-- ESTADÍSTICAS -->

<div class="stats">

<div class="stat-card">

<div
class="stat-number"
id="totalProducts"
>
0
</div>

<div class="stat-label">
Productos
</div>

</div>

<div class="stat-card">

<div
class="stat-number"
id="activeProducts"
>
0
</div>

<div class="stat-label">
Productos activos
</div>

</div>

<div class="stat-card">

<div
class="stat-number"
id="totalCategories"
>
0
</div>

<div class="stat-label">
Categorías
</div>

</div>

</div>

<!-- FORMULARIO -->

<section class="panel">

<div class="panel-header">

<h2
class="panel-title"
id="formTitle"
>
Agregar producto
</h2>

</div>

<form id="productForm">

<div class="form-grid">

<div class="field">

<label for="productName">
Nombre del producto
</label>

<input
id="productName"
type="text"
placeholder="Ej.: Bowl Pollo Grillado"
required

>

</div>

<div class="field">

<label for="productPrice">
Precio
</label>

<input
id="productPrice"
type="number"
placeholder="450"
min="0"
step="1"
required

>

</div>

<div class="field">

<label for="productCategory">
Categoría
</label>

<select
id="productCategory"
required

>

<option value="Ensaladas">
Ensaladas
</option>

<option value="Ensaladas calientes">
Ensaladas calientes
</option>

<option value="Sopas crema">
Sopas crema
</option>

</select>

</div>

<div class="field">

<label>
Foto del producto
</label>

<div class="image-upload-box">

<div class="image-upload-row">

<label
for="productImageFile"
class="file-label"

>

📷 Seleccionar foto </label>

<input
id="productImageFile"
class="file-input"
type="file"
accept="image/*"

>

<span
class="image-status"
id="imageStatus"

>

Ninguna foto seleccionada </span>

</div>

<div
class="image-preview"
id="imagePreview"
>

<img
id="previewImage"
src=""
alt="Vista previa"

>

<button
type="button"
class="remove-image-btn"
onclick="removeSelectedImage()"

>

× </button>

</div>

</div>

</div>

<div class="field full">

<label for="productDescription">
Descripción
</label>

<textarea
id="productDescription"
placeholder="Escribí una descripción del producto..."
></textarea>

</div>

</div>

<div class="form-actions">

<button
type="submit"
class="btn btn-primary"
id="saveProductButton"

>

Agregar producto </button>

<button
type="button"
class="btn btn-dark"
onclick="clearForm()"

>

Limpiar </button>

</div>

</form>

</section>

<!-- PRODUCTOS -->

<section class="panel">

<div class="panel-header">

<h2 class="panel-title">
Productos del negocio
</h2>

<button
class="btn btn-secondary"
onclick="loadProducts()"

>

Actualizar </button>

</div>

<div
id="productsList"
class="products-list"
>

<div class="loading">
Seleccioná un negocio para ver sus productos.
</div>

</div>

</section>

</main>

<div
id="toast"
class="toast"
>
Listo
</div>

<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
'https://cwiawvsxmkbohfbuouqv.supabase.co';

const SUPABASE_REST =
`${SUPABASE_URL}/rest/v1`;

const SUPABASE_STORAGE =
`${SUPABASE_URL}/storage/v1`;

const SUPABASE_KEY =
'sb_publishable_0JAQhasES693WKQkVh5ACw_NHnSPceG';

const STORAGE_BUCKET =
'product-images';


/* ==================================================
   ESTADO
================================================== */

let businesses = [];

let products = [];

let selectedBusinessId = null;

let editingProductId = null;

let selectedImageFile = null;

let currentImageUrl = null;

let removeCurrentImage = false;


/* ==================================================
   ELEMENTOS
================================================== */

const businessSelect =
document.getElementById(
'businessSelect'
);

const productForm =
document.getElementById(
'productForm'
);

const productName =
document.getElementById(
'productName'
);

const productPrice =
document.getElementById(
'productPrice'
);

const productCategory =
document.getElementById(
'productCategory'
);

const productImageFile =
document.getElementById(
'productImageFile'
);

const productDescription =
document.getElementById(
'productDescription'
);

const imageStatus =
document.getElementById(
'imageStatus'
);

const imagePreview =
document.getElementById(
'imagePreview'
);

const previewImage =
document.getElementById(
'previewImage'
);


/* ==================================================
   HEADERS SUPABASE
================================================== */

function supabaseHeaders(){

  return {

    'apikey':
    SUPABASE_KEY,

    'Authorization':
    `Bearer ${SUPABASE_KEY}`,

    'Content-Type':
    'application/json',

    'Prefer':
    'return=representation'

  };

}


/* ==================================================
   SELECCIONAR FOTO
================================================== */

productImageFile.addEventListener(
'change',
function(){

  const file =
  this.files &&
  this.files[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith('image/')){

    showToast(
      'Seleccioná una imagen válida'
    );

    this.value='';

    return;

  }

  selectedImageFile =
  file;

  removeCurrentImage =
  false;

  imageStatus.textContent =
  file.name;

  const reader =
  new FileReader();

  reader.onload =
  function(event){

    previewImage.src =
    event.target.result;

    imagePreview.classList.add(
      'show'
    );

  };

  reader.readAsDataURL(file);

});


/* ==================================================
   QUITAR FOTO
================================================== */

function removeSelectedImage(){

  selectedImageFile =
  null;

  productImageFile.value =
  '';

  removeCurrentImage =
  true;

  currentImageUrl =
  null;

  previewImage.src =
  '';

  imagePreview.classList.remove(
    'show'
  );

  imageStatus.textContent =
  'Sin foto';

}


/* ==================================================
   SUBIR FOTO
================================================== */

async function uploadImage(file){

  if(!file){
    return null;
  }

  const extension =
  file.name
  .split('.')
  .pop()
  .toLowerCase();

  const safeExtension =
  extension || 'jpg';

  const fileName =

  `${selectedBusinessId}/` +

  `${Date.now()}-` +

  `${Math.random()
    .toString(36)
    .substring(2,10)}` +

  `.${safeExtension}`;


  const uploadUrl =

  `${SUPABASE_STORAGE}/object/${STORAGE_BUCKET}/${fileName}`;


  const response =

  await fetch(

    uploadUrl,

    {

      method:'POST',

      headers:{

        'apikey':
        SUPABASE_KEY,

        'Authorization':
        `Bearer ${SUPABASE_KEY}`,

        'Content-Type':
        file.type,

        'x-upsert':
        'true'

      },

      body:file

    }

  );


  if(!response.ok){

    const errorText =
    await response.text();

    throw new Error(

      `Error subiendo imagen: ${errorText}`

    );

  }


  return (

    `${SUPABASE_STORAGE}/object/public/` +

    `${STORAGE_BUCKET}/` +

    `${fileName}`

  );

}


/* ==================================================
   CARGAR NEGOCIOS
================================================== */

async function loadBusinesses(){

  try{

    const response =

    await fetch(

      `${SUPABASE_REST}/Businesses?select=*`,

      {

        method:'GET',

        headers:
        supabaseHeaders()

      }

    );


    if(!response.ok){

      const errorText =
      await response.text();

      throw new Error(

        `Error ${response.status}: ${errorText}`

      );

    }


    businesses =
    await response.json();


    businessSelect.innerHTML =
    '';


    if(!businesses.length){

      businessSelect.innerHTML =

      '<option value="">No hay negocios registrados</option>';

      return;

    }


    businesses.forEach(

      business => {

        const option =

        document.createElement(
          'option'
        );


        option.value =
        business.id;


        option.textContent =

        business.name ||

        `Negocio ${business.id}`;


        businessSelect.appendChild(
          option
        );

      }

    );


    selectedBusinessId =
    businesses[0].id;


    businessSelect.value =
    selectedBusinessId;


    await loadProducts();


  }catch(error){

    console.error(error);


    businessSelect.innerHTML =

    '<option value="">Error cargando negocios</option>';


    showToast(
      'Error cargando los negocios'
    );

  }

}


/* ==================================================
   CAMBIAR NEGOCIO
================================================== */

function changeBusiness(){

  const value =
  businessSelect.value;


  if(!value){

    selectedBusinessId =
    null;

    products = [];

    renderProducts();

    return;

  }


  selectedBusinessId =
  Number(value);


  editingProductId =
  null;


  clearForm();


  loadProducts();

}


/* ==================================================
   CARGAR PRODUCTOS
================================================== */

async function loadProducts(){

  if(!selectedBusinessId){

    document.getElementById(
      'productsList'
    ).innerHTML =

    '<div class="empty">Seleccioná un negocio.</div>';

    return;

  }


  const list =

  document.getElementById(
    'productsList'
  );


  list.innerHTML =

  '<div class="loading">Cargando productos...</div>';


  try{

    const response =

    await fetch(

      `${SUPABASE_REST}/Products?business_id=eq.${selectedBusinessId}&select=*`,

      {

        method:'GET',

        headers:
        supabaseHeaders()

      }

    );


    if(!response.ok){

      const errorText =
      await response.text();


      throw new Error(

        `Error ${response.status}: ${errorText}`

      );

    }


    products =
    await response.json();


    renderProducts();


  }catch(error){

    console.error(error);


    list.innerHTML =

    `<div class="error">

      No se pudieron cargar los productos.

      <div class="error-details">

      ${escapeHTML(
        error.message
      )}

      </div>

    </div>`;

  }

}


/* ==================================================
   ORDEN DE CATEGORÍAS
================================================== */

const categoryOrder = [

  'Ensaladas',

  'Ensaladas calientes',

  'Sopas crema'

];


/* ==================================================
   MOSTRAR PRODUCTOS AGRUPADOS
================================================== */

function renderProducts(){

  const list =

  document.getElementById(
    'productsList'
  );


  updateStats();


  if(!products.length){

    list.innerHTML =

    '<div class="empty">Este negocio todavía no tiene productos.</div>';

    return;

  }


  const categories = {};


  products.forEach(

    product => {

      const category =

      product.category &&
      product.category.trim()

      ?

      product.category.trim()

      :

      'Sin categoría';


      if(!categories[category]){

        categories[category] = [];

      }


      categories[category].push(
        product
      );

    }

  );


  const sortedCategories =

  Object.keys(categories).sort(

    (a,b) => {

      const indexA =
      categoryOrder.indexOf(a);

      const indexB =
      categoryOrder.indexOf(b);


      if(
        indexA === -1 &&
        indexB === -1
      ){

        return a.localeCompare(
          b,
          'es'
        );

      }


      if(indexA === -1){
        return 1;
      }


      if(indexB === -1){
        return -1;
      }


      return indexA - indexB;

    }

  );


  list.innerHTML =

  sortedCategories.map(

    category => {

      const categoryProducts =

      categories[category];


      return `

      <div class="category-group">

        <h3 class="category-title">

          ${getCategoryIcon(category)}

          ${escapeHTML(category)}

        </h3>

        <div class="products-list">

          ${categoryProducts.map(

            product => `

            <div class="product-card">

              <div class="product-photo">

                ${

                  product.image_url

                  ?

                  `<img
                  src="${escapeAttribute(product.image_url)}"
                  alt="${escapeAttribute(
                    product.name ||
                    'Producto'
                  )}"
                  >`

                  :

                  `<div class="product-photo-placeholder">
                    ${getCategoryIcon(category)}
                  </div>`

                }

              </div>

              <div class="product-info">

                <h3>

                ${escapeHTML(
                  product.name ||
                  'Sin nombre'
                )}

                </h3>

                <p>

                ${escapeHTML(
                  product.descripcion ||
                  'Sin descripción'
                )}

                </p>

                <div class="product-price">

                $${Number(
                  product.price || 0
                ).toLocaleString('es-ES')}

                </div>

                <div class="product-status">

                  <span
                  class="status ${
                    product.active
                    ?
                    'active'
                    :
                    'inactive'
                  }"
                  >

                  ${
                    product.active
                    ?
                    'Activo'
                    :
                    'Inactivo'
                  }

                  </span>

                </div>

              </div>

              <div class="product-actions">

                <button
                class="btn btn-secondary"
                onclick="toggleProduct(
                  ${product.id},
                  ${product.active}
                )"
                >

                ${
                  product.active
                  ?
                  'Desactivar'
                  :
                  'Activar'
                }

                </button>

                <button
                class="btn btn-dark"
                onclick="editProduct(${product.id})"
                >

                Editar

                </button>

                <button
                class="btn btn-danger"
                onclick="deleteProduct(${product.id})"
                >

                Eliminar

                </button>

              </div>

            </div>

            `

          ).join('')}

        </div>

      </div>

      `;

    }

  ).join('');

}


/* ==================================================
   ICONOS
================================================== */

function getCategoryIcon(category){

  const normalized =

  String(category)
  .toLowerCase();


  if(
    normalized.includes(
      'ensalada caliente'
    )
  ){

    return '🍲';

  }


  if(
    normalized.includes(
      'ensalada'
    )
  ){

    return '🥗';

  }


  if(
    normalized.includes(
      'sopa'
    )
  ){

    return '🍵';

  }


  return '🍽️';

}


/* ==================================================
   AGREGAR / EDITAR PRODUCTO
================================================== */

productForm.addEventListener(

'submit',

async function(event){

  event.preventDefault();


  if(!selectedBusinessId){

    showToast(
      'Seleccioná un negocio primero'
    );

    return;

  }


  const name =
  productName.value.trim();


  const price =
  Number(
    productPrice.value
  );


  const category =
  productCategory.value;


  const descripcion =
  productDescription.value.trim();


  if(!name){

    showToast(
      'Ingresá el nombre del producto'
    );

    return;

  }


  if(price < 0){

    showToast(
      'El precio no puede ser negativo'
    );

    return;

  }


  const saveButton =

  document.getElementById(
    'saveProductButton'
  );


  const originalButtonText =

  saveButton.textContent;


  try{

    saveButton.disabled =
    true;

    saveButton.textContent =

    selectedImageFile

    ?

    'Subiendo foto...'

    :

    'Guardando...';


    let image_url =

    currentImageUrl;


    if(selectedImageFile){

      image_url =

      await uploadImage(
        selectedImageFile
      );

    }


    if(removeCurrentImage){

      image_url =
      null;

    }


    const payload = {

      name:name,

      price:price,

      category:category,

      image_url:
      image_url || null,

      descripcion:
      descripcion || null,

      active:true

    };


    let response;


    if(editingProductId){

      delete payload.active;


      response =

      await fetch(

        `${SUPABASE_REST}/Products?id=eq.${editingProductId}&business_id=eq.${selectedBusinessId}`,

        {

          method:'PATCH',

          headers:
          supabaseHeaders(),

          body:
          JSON.stringify(
            payload
          )

        }

      );

    }else{

      payload.business_id =
      selectedBusinessId;


      response =

      await fetch(

        `${SUPABASE_REST}/Products`,

        {

          method:'POST',

          headers:
          supabaseHeaders(),

          body:
          JSON.stringify(
            payload
          )

        }

      );

    }


    if(!response.ok){

      const errorText =
      await response.text();


      throw new Error(

        `Error ${response.status}: ${errorText}`

      );

    }


    showToast(

      editingProductId

      ?

      '✓ Producto actualizado'

      :

      '✓ Producto agregado'

    );


    clearForm();


    await loadProducts();


  }catch(error){

    console.error(error);


    showToast(

      'Error: ' +
      error.message

    );


  }finally{

    saveButton.disabled =
    false;

    saveButton.textContent =

    originalButtonText;

  }

}

);


/* ==================================================
   EDITAR PRODUCTO
================================================== */

function editProduct(id){

  const product =

  products.find(

    item =>

    Number(item.id) ===
    Number(id)

  );


  if(!product){
    return;
  }


  editingProductId =
  product.id;


  productName.value =
  product.name || '';


  productPrice.value =
  product.price || '';


  productCategory.value =

  product.category ||

  'Ensaladas';


  productDescription.value =

  product.descripcion || '';


  currentImageUrl =

  product.image_url ||

  null;


  selectedImageFile =
  null;

  removeCurrentImage =
  false;


  productImageFile.value =
  '';


  if(currentImageUrl){

    previewImage.src =
    currentImageUrl;

    imagePreview.classList.add(
      'show'
    );

    imageStatus.textContent =

    'Foto actual. Podés reemplazarla.';

  }else{

    previewImage.src =
    '';

    imagePreview.classList.remove(
      'show'
    );

    imageStatus.textContent =

    'Ninguna foto seleccionada';

  }


  document.getElementById(
    'formTitle'
  ).textContent =

  'Editar producto';


  document.getElementById(
    'saveProductButton'
  ).textContent =

  'Guardar cambios';


  window.scrollTo({

    top:0,

    behavior:'smooth'

  });

}


/* ==================================================
   LIMPIAR FORMULARIO
================================================== */

function clearForm(){

  editingProductId =
  null;

  selectedImageFile =
  null;

  currentImageUrl =
  null;

  removeCurrentImage =
  false;


  productForm.reset();


  productImageFile.value =
  '';


  previewImage.src =
  '';

  imagePreview.classList.remove(
    'show'
  );


  imageStatus.textContent =

  'Ninguna foto seleccionada';


  document.getElementById(
    'formTitle'
  ).textContent =

  'Agregar producto';


  document.getElementById(
    'saveProductButton'
  ).textContent =

  'Agregar producto';

}


/* ==================================================
   ACTIVAR / DESACTIVAR
================================================== */

async function toggleProduct(
  id,
  currentStatus
){

  try{

    const response =

    await fetch(

      `${SUPABASE_REST}/Products?id=eq.${id}&business_id=eq.${selectedBusinessId}`,

      {

        method:'PATCH',

        headers:
        supabaseHeaders(),

        body:

        JSON.stringify({

          active:
          !currentStatus

        })

      }

    );


    if(!response.ok){

      const errorText =
      await response.text();


      throw new Error(

        `Error ${response.status}: ${errorText}`

      );

    }


    showToast(

      currentStatus

      ?

      'Producto desactivado'

      :

      'Producto activado'

    );


    await loadProducts();


  }catch(error){

    console.error(error);


    showToast(

      'Error: ' +
      error.message

    );

  }

}


/* ==================================================
   ELIMINAR PRODUCTO
================================================== */

async function deleteProduct(id){

  const product =

  products.find(

    item =>

    Number(item.id) ===
    Number(id)

  );


  if(!product){
    return;
  }


  const confirmed =

  confirm(

    `¿Querés eliminar "${product.name}"?`

  );


  if(!confirmed){
    return;
  }


  try{

    const response =

    await fetch(

      `${SUPABASE_REST}/Products?id=eq.${id}&business_id=eq.${selectedBusinessId}`,

      {

        method:'DELETE',

        headers:
        supabaseHeaders()

      }

    );


    if(!response.ok){

      const errorText =
      await response.text();


      throw new Error(

        `Error ${response.status}: ${errorText}`

      );

    }


    showToast(
      'Producto eliminado'
    );


    await loadProducts();


  }catch(error){

    console.error(error);


    showToast(

      'Error: ' +
      error.message

    );

  }

}


/* ==================================================
   ESTADÍSTICAS
================================================== */

function updateStats(){

  const total =
  products.length;


  const active =

  products.filter(

    product =>

    product.active === true

  ).length;


  const categories =

  new Set(

    products.map(

      product =>

      product.category

    )

    .filter(Boolean)

  );


  document.getElementById(
    'totalProducts'
  ).textContent =

  total;


  document.getElementById(
    'activeProducts'
  ).textContent =

  active;


  document.getElementById(
    'totalCategories'
  ).textContent =

  categories.size;

}


/* ==================================================
   SEGURIDAD HTML
================================================== */

function escapeHTML(text){

  return String(text)

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}


function escapeAttribute(text){

  return escapeHTML(text);

}


/* ==================================================
   MENSAJES
================================================== */

function showToast(text){

  const toast =

  document.getElementById(
    'toast'
  );


  toast.textContent =
  text;


  toast.classList.add(
    'show'
  );


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =

  setTimeout(

    function(){

      toast.classList.remove(
        'show'
      );

    },

    2500

  );

}


/* ==================================================
   INICIO
================================================== */

async function init(){

  console.log(
    'Iniciando panel de administración...'
  );


  await loadBusinesses();

}


init();
