<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Ingreso al panel</title>

<style>

:root{
  --black:#070807;
  --card:#151815;
  --olive:#718238;
  --olive-light:#9aae52;
  --yellow:#f5c518;
  --yellow-light:#ffd83d;
  --red:#e53935;
  --white:#f7f7f2;
  --muted:#b8bdb5;
  --line:rgba(255,255,255,.10);
  --shadow:0 20px 50px rgba(0,0,0,.40);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:
  radial-gradient(
    circle at 20% 0%,
    rgba(113,130,56,.30),
    transparent 35%
  ),
  radial-gradient(
    circle at 90% 20%,
    rgba(245,197,24,.12),
    transparent 30%
  ),
  var(--black);
  color:var(--white);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.login-card{
  width:min(430px,100%);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:30px;
  box-shadow:var(--shadow);
}

.brand{
  text-align:center;
  margin-bottom:25px;
}

.brand h1{
  margin:0;
  font-size:2rem;
  letter-spacing:.08em;
}

.brand h1 span{
  color:var(--yellow);
}

.brand p{
  margin:8px 0 0;
  color:var(--muted);
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-bottom:16px;
}

label{
  color:var(--muted);
  font-size:.88rem;
  font-weight:700;
}

input{
  width:100%;
  background:#090a09;
  color:var(--white);
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  outline:none;
  font:inherit;
}

input:focus{
  border-color:var(--olive-light);
  box-shadow:0 0 0 3px rgba(154,174,82,.12);
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px 16px;
  background:var(--yellow);
  color:#000;
  font:inherit;
  font-weight:900;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  background:var(--yellow-light);
  transform:translateY(-1px);
}

button:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

.message{
  min-height:24px;
  margin-top:15px;
  text-align:center;
  font-size:.92rem;
  color:var(--muted);
}

.message.error{
  color:var(--red);
}

.message.success{
  color:var(--olive-light);
}

.footer-note{
  margin-top:20px;
  text-align:center;
  color:var(--muted);
  font-size:.78rem;
}

</style>

</head>

<body>

<section class="login-card">

  <div class="brand">

    <h1>
      VERDE <span>OLIVA</span>
    </h1>

    <p>
      Ingreso al panel de administración
    </p>

  </div>

  <form id="loginForm">

    <div class="field">

      <label for="email">
        Correo electrónico
      </label>

      <input
      id="email"
      type="email"
      autocomplete="email"
      required
      >

    </div>

    <div class="field">

      <label for="password">
        Contraseña
      </label>

      <input
      id="password"
      type="password"
      autocomplete="current-password"
      required
      >

    </div>

    <button
    type="submit"
    id="loginButton"
    >
      Ingresar
    </button>

  </form>

  <div
  id="message"
  class="message"
  ></div>

  <div class="footer-note">
    Acceso exclusivo para usuarios autorizados.
  </div>

</section>

<script>

const SUPABASE_URL =
'https://cwiawvsxmkbohfbuouqv.supabase.co';

const SUPABASE_KEY =
'sb_publishable_0JAQhasES693WKQkVh5ACw_NHnSPceG';

const loginForm =
document.getElementById('loginForm');

const emailInput =
document.getElementById('email');

const passwordInput =
document.getElementById('password');

const loginButton =
document.getElementById('loginButton');

const message =
document.getElementById('message');


/* =========================
   MOSTRAR MENSAJES
========================= */

function showMessage(
  text,
  type = ''
){

  message.textContent = text;

  message.className =
  'message' +
  (type ? ` ${type}` : '');

}


/* =========================
   GUARDAR SESIÓN
========================= */

function saveSession(data){

  if(
    !data ||
    !data.access_token
  ){

    throw new Error(
      'Supabase no devolvió una sesión válida.'
    );

  }

  localStorage.setItem(
    'sb_access_token',
    data.access_token
  );

  localStorage.setItem(
    'sb_refresh_token',
    data.refresh_token || ''
  );

  localStorage.setItem(
    'sb_user',
    JSON.stringify(
      data.user || null
    )
  );

}


/* =========================
   REVISAR SI YA HAY SESIÓN
========================= */

function checkExistingSession(){

  const token =
  localStorage.getItem(
    'sb_access_token'
  );

  if(token){

    window.location.href =
    'admin.html';

  }

}


/* =========================
   INICIAR SESIÓN
========================= */

loginForm.addEventListener(
'submit',
async function(event){

  event.preventDefault();

  const email =
  emailInput.value.trim();

  const password =
  passwordInput.value;

  if(
    !email ||
    !password
  ){

    showMessage(
      'Completá el correo y la contraseña.',
      'error'
    );

    return;

  }

  loginButton.disabled = true;

  loginButton.textContent =
  'Ingresando...';

  showMessage('');

  try{

    const response =
    await fetch(

      `${SUPABASE_URL}/auth/v1/token?grant_type=password`,

      {

        method:'POST',

        headers:{

          'apikey':
          SUPABASE_KEY,

          'Content-Type':
          'application/json'

        },

        body:
        JSON.stringify({

          email:email,

          password:password

        })

      }

    );


    const data =
    await response.json();


    if(!response.ok){

      let text =
      'No se pudo iniciar sesión.';

      if(
        data &&
        data.error_description
      ){

        text =
        data.error_description;

      }else if(
        data &&
        data.msg
      ){

        text =
        data.msg;

      }

      throw new Error(text);

    }


    saveSession(data);


    showMessage(
      'Ingreso correcto. Abriendo el panel...',
      'success'
    );


    setTimeout(

      function(){

        window.location.href =
        'admin.html';

      },

      700

    );


  }catch(error){

    console.error(error);

    showMessage(
      error.message ||
      'Error al iniciar sesión.',
      'error'
    );

  }finally{

    loginButton.disabled = false;

    loginButton.textContent =
    'Ingresar';

  }

});


checkExistingSession();

</script>

</body>
</html>
